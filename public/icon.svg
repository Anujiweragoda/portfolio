<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tech/Modern Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Vibrant Monogram Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Subtle Top Surface Reflection -->
    <linearGradient id="glassGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- App Icon Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Icon Base (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGradient)" filter="url(#dropShadow)" />

  <!-- Subtle Glass Highlight Overlay -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#glassGlint)" />

  <!-- Inner Subtle Border Accent -->
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Integrated "AW" Monogram Vector -->
  <g fill="url(#brandGradient)">
    <!-- "A" Left Leg -->
    <path d="M 110 370 L 195 142 C 198 134 206 128 215 128 L 222 128 C 231 128 239 134 242 142 L 285 258 L 245 272 L 218 198 L 152 370 Z" />

    <!-- "A" Right Leg / Interlocking "W" Left Leg -->
    <path d="M 230 370 L 290 205 L 328 308 C 331 316 339 322 348 322 L 352 322 C 361 322 369 316 372 308 L 415 190 L 452 203 L 398 350 C 395 358 387 364 378 364 L 370 364 C 361 364 353 358 350 350 L 310 242 L 268 358 C 265 365 258 370 249 370 Z" />

    <!-- Crossbar of "A" connecting into "W" -->
    <path d="M 165 310 L 298 262 L 311 298 L 178 346 Z" opacity="0.95" />

    <!-- "W" Far Right Peak -->
    <path d="M 370 142 L 410 128 L 460 265 L 422 278 Z" opacity="0.85" />
  </g>

  <!-- Modern Accent Dot -->
  <circle cx="410" cy="135" r="14" fill="#00F2FE" />
</svg>
